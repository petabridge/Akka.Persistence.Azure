# Release task for PbLib projects
# See https://docs.microsoft.com/en-us/azure/devops/pipelines/yaml-schema for reference

trigger:
  branches:
    include:
      - refs/tags/*

variables:
  - group: Signing Keys #create this group with SECRET variables `signingUsername` and `signingPassword`
  - group: NuGet Keys #create this group with SECRET variables `nugetKey`
  - name: githubConnectionName
    value: Releases #replace this
  - name: projectName
    value: Akka.Persistence.Azure #replace this
  - name: githubRepositoryName
    value: petabridge/Akka.Persistence.Azure #replace this

jobs:
  - job: Release
    pool:
      vmImage: windows-latest
      demands: Cmd
    steps:
      - task: UseDotNet@2
        displayName: 'Use .NET SDK from global.json'
        inputs:
          useGlobalJson: true

      - powershell: ./build.ps1
        displayName: 'Update Release Notes'

      # Pack without version suffix for release
      - script: dotnet pack -c Release -o $(Build.ArtifactStagingDirectory)/nuget
        displayName: 'Create packages'

      - script: dotnet nuget push "$(Build.ArtifactStagingDirectory)\nuget\*.nupkg" --api-key $(Akka.NET Tools NuGet) --source https://api.nuget.org/v3/index.json --skip-duplicate
        displayName: 'Publish to NuGet.org'

      - task: GitHubRelease@0
        displayName: 'GitHub release (create)'
        inputs:
          gitHubConnection: $(githubConnectionName)
          repositoryName: $(githubRepositoryName)
          title: '$(projectName) v$(Build.SourceBranchName)'
          releaseNotesFile: 'RELEASE_NOTES.md'
          assets: '$(Build.ArtifactStagingDirectory)/nuget/*.nupkg'
